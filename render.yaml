# Configuración del servicio en Render, versionada en el repositorio.
# Render la lee al crear el servicio con "New > Blueprint".
#
# Las variables marcadas con sync: false NO viajan en el repositorio: se cargan
# a mano en el panel de Render (docs/arquitectura.md, sección 6).
services:
  - type: web
    name: sistemalegal-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # --include=dev no es opcional: NODE_ENV=production hace que npm ci omita
    # las devDependencies, y entonces el build no usa el TypeScript del
    # lockfile sino el tsc global de la imagen de Render, que es otra version.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      # Cadena de conexión de Supabase. Tiene que ser la del POOLER compartido en
      # modo transacción (aws-X-REGION.pooler.supabase.com:6543), no la conexión
      # directa: esa es IPv6 y Render no tiene salida IPv6.
      - key: DATABASE_URL
        sync: false
      # Dominio de producción de Vercel.
      - key: CORS_ORIGIN
        sync: false
      - key: CORS_PREFIJO_PREVIEW
        value: sistemalegal
