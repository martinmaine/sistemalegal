name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (typecheck, build, pruebas)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sistemalegal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sistemalegal

    steps:
      - uses: actions/checkout@v4

      - name: Aplicar esquema y seeds
        run: |
          psql -h localhost -U postgres -d sistemalegal -v ON_ERROR_STOP=1 -f database/schema.sql
          psql -h localhost -U postgres -d sistemalegal -v ON_ERROR_STOP=1 -f database/seed/001_catalogos.sql
          psql -h localhost -U postgres -d sistemalegal -v ON_ERROR_STOP=1 -f database/seed/002_datos_demo.sql

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - run: npm run typecheck
        working-directory: backend

      - run: npm run build
        working-directory: backend

      # Con DATABASE_URL presente corren también las pruebas de integración
      # contra el esquema real, no solo las unitarias.
      - run: npm test
        working-directory: backend

  frontend:
    name: Frontend (typecheck y build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
